<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant | Zepox Co</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #ff007f;
            --deep-pink: #ff0055;
            --bg-grey: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-grey);
            color: white;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #threed-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        nav {
            padding: 15px 5%;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: var(--primary-pink);
        }

        .logo {
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-pink);
            font-weight: 800;
        }

        .ai-container {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .glass-chat-box {
            width: 100%;
            max-width: 1100px;
            height: 80vh;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 25px;
            background: rgba(255, 0, 127, 0.1);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ai-status {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            nav {
                padding: 12px 15px;
            }

            .logo {
                font-size: 1rem;
            }

            .ai-container {
                padding: 10px;
                /* Nafasi ndogo pembeni ili chat iwe kubwa */
            }

            .glass-chat-box {
                height: 90vh;
                /* Kurefusha box kwenye simu */
                border-radius: 20px;
                border-left: none;
                border-right: none;
            }

            .chat-header {
                padding: 10px 15px;
                font-size: 0.85rem;
            }

            .back-btn span {
                display: none;
                /* Kuficha maandishi "Rudi Nyumbani" ili kupata nafasi */
            }
        }
    </style>
</head>

<body>

    <div id="threed-bg"></div>

    <nav>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> <span>Rudi Nyumbani</span>
        </a>
        <div class="logo">ZEPOX <span>AI</span></div>
        <div style="width: 40px;"></div>
    </nav>

    <main class="ai-container">
        <div class="glass-chat-box">
            <div class="chat-header">
                <div class="ai-status"></div>
                <span>Zepox Smart Assistant Online</span>
            </div>

            <iframe src="https://www.chatbase.co/chatbot-iframe/cDzPuc-kHsOBV21J4pLKh" title="Zepox AI"></iframe>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Optimization: Alpha true inasaidia kuchanganya na background ya CSS vizuri
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Inazuia matumizi makubwa ya GPU kwenye vioo vya 4K
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('threed-bg').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();

            // Optimization: Punguza idadi ya particles kwenye simu ili kuokoa RAM
            const count = window.innerWidth < 600 ? 350 : 800;

            const posArr = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) posArr[i] = (Math.random() - 0.5) * 10;

            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.005,
                color: 0xff007f,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);
            camera.position.z = 3;
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0008; // Mwendo wa taratibu zaidi
            renderer.render(scene, camera);
        }

        initThree();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
