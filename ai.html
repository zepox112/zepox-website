<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant | Zepox Co</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #ff007f;
            --bg-grey: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Rekebisho la urefu wa kioo kwa simu */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Inazuia ukurasa mzima ku-scroll */
            background-color: var(--bg-grey);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #threed-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        nav {
            height: 60px;
            padding: 0 5%;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* Inazuia nav isinywe */
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--primary-pink); font-weight: 800; }

        /* Container sasa inachukua nafasi iliyobaki tu */
        .ai-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        .glass-chat-box {
            width: 100%;
            max-width: 1000px;
            height: 100%; /* Inachukua 100% ya ai-container pekee */
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 20px;
            background: rgba(255, 0, 127, 0.1);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .ai-status {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Iframe lazima iwe na height ya kueleweka */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* Mobile specific fixes */
        @media (max-width: 600px) {
            .ai-container {
                padding: 10px; /* Nafasi ndogo sana pembeni */
            }
            .back-btn span { display: none; }
            .chat-header span { font-size: 0.8rem; }
        }
    </style>
</head>

<body>
    <div id="threed-bg"></div>

    <nav>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> <span>Rudi</span>
        </a>
        <div class="logo">ZEPOX <span>AI</span></div>
        <div style="width: 30px;"></div>
    </nav>

    <main class="ai-container">
        <div class="glass-chat-box">
            <div class="chat-header">
                <div class="ai-status"></div>
                <span>Zepox Smart Assistant</span>
            </div>
            <iframe src="https://www.chatbase.co/chatbot-iframe/cDzPuc-kHsOBV21J4pLKh" title="Zepox AI"></iframe>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Optimization ya RAM na kuzuia joto
        let scene, camera, renderer, particles;
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Inapunguza mzigo wa GPU
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('threed-bg').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const count = window.innerWidth < 600 ? 250 : 600; // Particles chache zaidi kwa simu
            const posArr = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) posArr[i] = (Math.random() - 0.5) * 10;
            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.006, color: 0xff007f }));
            scene.add(particles);
            camera.position.z = 3;
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        initThree();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
