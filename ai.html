<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | Zepox Co</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-grey: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-grey);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            /* Kuzuia scroll kumpoteza mtumiaji */
            display: flex;
            flex-direction: column;
        }

        /* Background ya 3D */
        #threed-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        /* Navigation Bar */
        nav {
            padding: 15px 5%;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .back-btn:hover {
            color: #cccccc;
        }

        .logo {
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .logo span {
            color: #ffffff;
            font-weight: 800;
            opacity: 0.7;
        }

        /* Container ya AI */
        .ai-container {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-chat-box {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .ai-status {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        /* Iframe ya Chatbase */
        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .glass-chat-box {
                height: 85vh;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="threed-bg"></div>

    <nav>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Rudi Nyumbani
        </a>
        <div class="logo">ZEPOX <span>AI</span></div>
        <div style="width: 100px;"></div>
    </nav>

    <main class="ai-container">
        <div class="glass-chat-box">
            <div class="chat-header">
                <div class="ai-status"></div>
                <span>Zepox Smart Assistant Online</span>
            </div>

            <iframe src="https://www.chatbase.co/chatbot-iframe/cDzPuc-kHsOBV21J4pLKh" title="Zepox AI"></iframe>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, particles;
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('threed-bg').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const count = 800; // Idadi ya vichembechembe
            const posArr = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) posArr[i] = (Math.random() - 0.5) * 10;
            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const mat = new THREE.PointsMaterial({ size: 0.005, color: 0xffffff });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);
            camera.position.z = 3;
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
        }

        initThree();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
